seed: 42

model:
  id: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  class: Qwen3_5ForCausalLM
  dtype: bfloat16
  add_generation_prompt: true
  use_cache: false

dataset:
  id: viliana-dev/eval-awareness-2x2
  revision: a50e4c983e7e66ebbe8f160e3549cc98e29271d4
  selected_path: data/selected/english_selected_v2.jsonl
  selected_sha256: 4e42d1ce8bd19de99538b33c872e7a411e3846f3e72b8026e2ac7b09863d2639
  quadrants:
    bench_eval:
      config: bench_eval
      model_facing_field: formatted_prompt
      context_label: 1
      format_label: 1
    casual_eval:
      config: casual_eval_mutual
      model_facing_field: first_turn
      context_label: 1
      format_label: 0
    bench_deploy:
      config: bench_deploy_rewritten
      model_facing_field: rewritten
      context_label: 0
      format_label: 1
    casual_deploy:
      config: casual_deploy_matched
      model_facing_field: first_turn
      context_label: 0
      format_label: 0
  manually_excluded_rows:
    bench_deploy: [259, 735]
    casual_deploy: [559, 651]
  sample_per_quadrant: 300
  train_per_quadrant: 210
  test_per_quadrant: 90
  cv_folds: 5

selection_v2:
  anchors_per_format: 300
  train_pairs_per_format: 210
  test_pairs_per_format: 90
  cv_folds: 5
  matching_features:
    - character_count
    - whitespace_word_count
  common_support_feature: character_count
  assignment: scipy.optimize.linear_sum_assignment

activation_extraction:
  batch_size: 4
  batch_order: frozen_manifest_order
  batch_membership: consecutive_rows
  padding: dynamic
  padding_side: right
  truncation: false
  final_token_selection: rightmost_nonzero_attention_mask
  activation_mapping: raw_outputs_all_32_decoder_blocks_via_forward_hooks
  storage_dtype: float32
  languages:
    - english
    - spanish
    - japanese
  same_extraction_path_all_languages: true

probe:
  penalty: l2
  C: 1.0
  max_iter: 2000
  threshold: 0.5
  primary_metric: roc_auc
